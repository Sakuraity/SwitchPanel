name: SwitchPanel
options:
  bundleIdPrefix: dev.kangyuan
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "5.9"
targets:
  SwitchPanel:
    type: application
    platform: macOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kangyuan.switchpanel
        PRODUCT_NAME: SwitchPanel
        INFOPLIST_KEY_CFBundleDisplayName: Switch Panel
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSAppleEventsUsageDescription: Switch Panel 需要通过系统事件切换外观，并通过访达清空废纸篓。
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_ENTITLEMENTS: Resources/SwitchPanel.entitlements
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_TESTABILITY: YES
        SWIFT_OBJC_BRIDGING_HEADER: Resources/SwitchPanel-Bridging-Header.h
        CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: NO
        HEADER_SEARCH_PATHS: $(SRCROOT)/App/Power
    entitlements:
      path: Resources/SwitchPanel.entitlements
  SwitchPanelTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: SwitchPanel
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SwitchPanel.app/Contents/MacOS/SwitchPanel"
        BUNDLE_LOADER: "$(TEST_HOST)"